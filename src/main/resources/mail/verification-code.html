<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>ClubHub 인증번호</title>
</head>
<!--
  메일 앱마다 지원하는 HTML이 다르다. 학교 메일(Outlook)은 CSS를 거의 무시하므로
  레이아웃은 table로 잡고 스타일은 전부 인라인으로 둔다. 외부 CSS·웹폰트·스크립트는 쓰지 않는다.
-->
<body style="margin:0; padding:0; background-color:#f4f5f9;">

  <!-- 받은편지함 목록에서 제목 옆에 보이는 미리보기 문구. 본문에는 보이지 않는다. -->
  <div style="display:none; max-height:0; overflow:hidden; opacity:0; mso-hide:all;">
    아래 인증번호를 입력해 학교 이메일 인증을 완료해주세요.
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f5f9;">
    <tr>
      <td align="center" style="padding:40px 16px;">

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
               style="max-width:480px; background-color:#ffffff; border-radius:12px;">
          <tr>
            <td style="padding:32px 32px 0 32px; font-family:'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;">
              <span style="font-size:20px; font-weight:700; color:#4a57c4; letter-spacing:-0.3px;">ClubHub</span>
            </td>
          </tr>

          <tr>
            <td style="padding:28px 32px 0 32px; font-family:'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;">
              <h1 style="margin:0; font-size:22px; font-weight:700; line-height:1.4; color:#22304a;">
                학교 이메일 인증번호
              </h1>
              <p style="margin:12px 0 0 0; font-size:15px; line-height:1.7; color:#4b5563;">
                아래 인증번호를 ClubHub 화면에 입력해주세요.
              </p>
            </td>
          </tr>

          <tr>
            <td style="padding:24px 32px 0 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center"
                      style="padding:22px 0; background-color:#f4f5f9; border-radius:8px;
                             font-family:'SF Mono',Menlo,Consolas,'Courier New',monospace;
                             font-size:30px; font-weight:700; letter-spacing:6px; color:#22304a;">
                    {{code}}
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="padding:16px 32px 0 32px; font-family:'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;
                       font-size:14px; line-height:1.7; color:#6b7280;">
              인증번호는 <strong style="color:#22304a;">{{expiryMinutes}}분</strong> 동안 유효합니다. ({{expiresAt}}까지)
            </td>
          </tr>

          <tr>
            <td style="padding:28px 32px 32px 32px; font-family:'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="border-top:1px solid #e5e7eb; padding-top:18px;
                             font-size:13px; line-height:1.7; color:#6b7280;">
                    본인이 요청하지 않았다면 이 메일을 무시하셔도 됩니다.<br>
                    인증번호는 누구에게도 알려주지 마세요. ClubHub는 인증번호를 묻지 않습니다.
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
          <tr>
            <td align="center"
                style="padding:20px 32px; font-family:'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;
                       font-size:12px; line-height:1.7; color:#9ca3af;">
              이 메일은 발신 전용이라 회신할 수 없습니다.<br>
              <a href="https://www.clubhubb.co.kr" style="color:#9ca3af; text-decoration:underline;">www.clubhubb.co.kr</a>
              &nbsp;·&nbsp; © ClubHub
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>
</body>
</html>
